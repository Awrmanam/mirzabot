name: Rebecca support

on:
  push:
    branches:
      - rebecca-support
  workflow_dispatch:
  pull_request:
    branches:
      - rebecca-support
      - feature/vpn-app-pairing-20261029

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      MIRZA_TEST_DB_HOST: 127.0.0.1
      MIRZA_TEST_DB_PORT: 3306
      MIRZA_TEST_DB_USER: root
      MIRZA_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          php -l keyboard.php
          php -l admin.php
          php -l panels.php
          php -l Marzban.php
          php -l botapi.php
          php -l function.php
          php -l index.php
          php -l app_pairing.php
          php -l api/vpnapp.php
          php -l tests/vpnapp_store_static.php
          php -l tests/app_pairing_static.php
          php -l table.php
          php -l emoji_install.php
          php -l emoji_system.php
          php -l ticket_install.php
          php -l ticket_system.php
          php -l scripts/migrate_custom_emoji.php
          php -l scripts/cleanup_custom_emoji_usage.php
          php -l tests/custom_emoji_performance.php
          php -l tests/performance_static_checks.php
          php -l product_panel_identity.php
          php -l alireza_single.php
          php -l tests/alireza_redirect_reauth_static.php
          php -l tests/installer_premium_emoji_static.php
          php -l tests/product_panel_stable_id_static.php
          php -l tests/product_panel_stable_id_integration.php
          php -l tests/product_inline_emoji_static.php
          php -l tests/product_inline_emoji_integration.php
          php -l tests/panel_inline_emoji_static.php
          php -l tests/panel_inline_emoji_integration.php
          php -l tests/regression_safety_checks.php

      - name: Validate app pairing contract
        run: php tests/app_pairing_static.php
      - name: Validate standalone VPN store bridge
        run: php tests/vpnapp_store_static.php

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Validate styled emoji UTF-16 rendering
        run: |
          php -r '
            $pdo = null;
            $APIKEY = "";
            define("CUSTOM_EMOJI_ENABLED", true);
            require "emoji_system.php";
            if (styledUtf16Length("💎") !== 2 || styledUtf16Length("A💎") !== 3) {
                fwrite(STDERR, "UTF-16 length validation failed\n");
                exit(1);
            }
            $rendered = renderStyledText("<b>A</b><tg-emoji emoji-id=\"5368324170671202286\">💎</tg-emoji>", "HTML", "ci");
            $custom = array_values(array_filter($rendered["entities"], function ($entity) {
                return $entity["type"] === "custom_emoji";
            }));
            if (count($custom) !== 1 || $custom[0]["offset"] !== 1 || $custom[0]["length"] !== 2) {
                fwrite(STDERR, "Custom emoji entity validation failed\n");
              exit(1);
            }
          '
          php -r '
            $pdo = null;
            $APIKEY = "";
            define("CUSTOM_EMOJI_ENABLED", false);
            require "emoji_system.php";
            $source = "{emoji:brand} unchanged";
            $rendered = renderStyledText($source, "HTML", "ci-disabled");
            $button = buildStyledButton("Button", ["callback_data" => "noop"], "brand");
            if (strpos($rendered["text"], "{emoji:") !== false || isset($button["icon_emoji_key"])) {
                fwrite(STDERR, "Disabled feature flag changed the legacy path\n");
                exit(1);
            }
          '

      - name: Validate Custom Emoji performance invariants
        run: |
          php tests/custom_emoji_performance.php disabled
          php tests/custom_emoji_performance.php enabled
          php tests/custom_emoji_performance.php usage
          php tests/performance_static_checks.php

      - name: Validate product, panel and emoji regressions
        run: |
          php tests/installer_premium_emoji_static.php
          php tests/product_panel_stable_id_static.php
          php tests/product_panel_stable_id_integration.php
          php tests/product_inline_emoji_static.php
          php tests/product_inline_emoji_integration.php
          php tests/panel_inline_emoji_static.php
          php tests/panel_inline_emoji_integration.php
          php tests/regression_safety_checks.php
          php tests/alireza_redirect_reauth_static.php

      - name: Verify Rebecca integration and fork-pinned installer
        shell: bash
        run: |
          grep -Fq "'text' => \"ربکا\"" keyboard.php
          grep -Fq "'callback_data' => \"typepanel#rebecca\"" keyboard.php
          grep -Fq 'function rebecca_service_id_from_value' Marzban.php
          grep -Fq '"service_id" => $rebecca_service_id' Marzban.php
          grep -Fq '$is_rebecca_panel' Marzban.php
          grep -Fq '$database_panel_version' admin.php
          grep -Fq '$inbounds_to_store = array(' admin.php
          grep -Fq "require_once 'ticket_system.php'" index.php
          grep -Fq 'function ticketCreateFromDraft' ticket_system.php
          grep -Fq 'function ticketHandleUpdate' ticket_system.php
          grep -Fq 'function ticketCheckOutageAlert' ticket_system.php
          grep -Fq 'ticket_service_locks' ticket_system.php
          grep -Fq 'id_user = ?' ticket_system.php
          grep -Fq 'icon_custom_emoji_id' botapi.php
          grep -Fq 'styledPrepareTelegramRequest' botapi.php
          grep -Fq '__telegram_fallback_attempted' botapi.php
          grep -Fq 'CUSTOM_EMOJI_ENABLED' config.php
          grep -Fq 'function styledCustomEmojiEnabled' emoji_system.php
          grep -Fq 'function styledPrepareDisabledTelegramRequest' emoji_system.php
          grep -Fq 'function styledUtf16Length' emoji_system.php
          grep -Fq 'function renderStyledText' emoji_system.php
          grep -Fq 'function buildStyledButton' emoji_system.php
          grep -Fq 'function sendStyledMessage' emoji_system.php
          grep -Fq 'function editStyledMessage' emoji_system.php
          grep -Fq 'message.entities' emoji_system.php || grep -Fq "['entities', 'caption_entities']" emoji_system.php
          grep -Fq 'icon_emoji_key' emoji_system.php
          grep -Fq 'styled_emojis' emoji_install.php
          grep -Fq 'styled_emoji_usage' emoji_install.php
          grep -Fq 'MIRZA_CUSTOM_EMOJI_MIGRATION' scripts/migrate_custom_emoji.php
          grep -Fq 'CUSTOM_EMOJI_USAGE_TRACKING' config.php
          grep -Fq 'mirzaCronCommand' function.php
          grep -Fq 'styledApplyLanguageOverrides' function.php
          grep -Fq 'styledHandleUpdate' index.php
          grep -Fq 'styledEnhanceAdminKeyboard' keyboard.php
          grep -Fq 'emoji_key' ticket_system.php
          grep -Fq 'ticket_install.php' table.php
          grep -Fq 'readonly MIRZA_SOURCE_BRANCH="rebecca-support"' install.sh
          grep -Fq 'readonly MIRZA_SOURCE_ARCHIVE_URL="https://github.com/Awrmanam/mirzabot/archive/refs/heads/${MIRZA_SOURCE_BRANCH}.zip"' install.sh
          grep -Fq 'readonly MIRZA_SOURCE_INSTALLER_URL="https://raw.githubusercontent.com/Awrmanam/mirzabot/refs/heads/${MIRZA_SOURCE_BRANCH}/install.sh"' install.sh
          grep -Fq 'ZIP_URL="$MIRZA_SOURCE_ARCHIVE_URL"' install.sh
