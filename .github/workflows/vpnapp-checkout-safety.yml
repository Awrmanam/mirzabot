name: VPN app pending checkout safety
on:
  push:
    branches: [fix/vpnapp-multiple-pending-receipts-20261030, fix/vpnapp-admin-snapshot-collations-20261030, fix/async-receipt-telegram-20261030, fix/reconcile-receipt-pending-20261030]
    paths: ['api/vpnapp.php', 'scripts/patch_vpnapp_pending_orders.py', 'scripts/patch_vpnapp_telegram_receipts.py', 'scripts/**', '.github/workflows/vpnapp-checkout-safety.yml']
  pull_request:
    branches: [feature/vpn-app-store-bridge-20261029, fix/vpnapp-multiple-pending-receipts-20261030, feature/vpnapp-private-receipt-review-20261030]
    paths: ['api/vpnapp.php', 'scripts/patch_vpnapp_pending_orders.py', 'scripts/patch_vpnapp_telegram_receipts.py', 'scripts/**']
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/vpnapp.php
          php -l scripts/inspect_vpnapp_orders.php
          php -l scripts/vpnapp_receipt_worker.php
          php -l scripts/inspect_vpnapp_receipts.php
          python3 -m py_compile scripts/inspect_vpnapp_live_layout.py
      - name: Receipt systemd installer syntax
        run: |
          bash -n scripts/install_vpnapp_async_receipt.sh
          bash -n scripts/install_vpnapp_recovery.sh
      - name: Test surgical patchers preserving custom code
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_pending_orders.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_telegram_receipts.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_live_safe.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_photo_gallery.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_snapshot_collations.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_async_receipt.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_unblock_card_orders.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_patch_vpnapp_legacy_receipts.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_vpnapp_live_layout.py' -v
